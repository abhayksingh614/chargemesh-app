version: "3.9"

networks:
  chargemesh_internal:
    driver: bridge

volumes:
  chargemesh_pgdata_prod:
  chargemesh_redisdata_prod:

services:
  # ─── PostgreSQL 16 + PostGIS ───────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: chargemesh_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-chargemesh_prod}
      POSTGRES_USER: ${DB_USERNAME:-chargemesh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
    volumes:
      - chargemesh_pgdata_prod:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-chargemesh} -d ${DB_DATABASE:-chargemesh_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - chargemesh_internal

  # ─── Redis 7 Distributed Rate Limiter ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chargemesh_redis_prod
    restart: always
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - chargemesh_redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - chargemesh_internal

  # ─── ChargeMesh Backend & CSMS Hub ─────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: chargemesh_backend_prod
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be at least 32 characters in production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-chargemesh}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-chargemesh_prod}
      DB_SYNCHRONIZE: "false"
      DB_MIGRATIONS_RUN: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://admin.chargemesh.com}
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - chargemesh_internal

  # ─── ChargeMesh Admin Portal (Next.js) ────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: chargemesh_admin_prod
    restart: always
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - chargemesh_internal
