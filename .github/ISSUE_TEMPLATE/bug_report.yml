name: Bug Report
description: Create a report to help us improve ChargeMesh
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in ChargeMesh! Please provide as much context as possible to help us reproduce and resolve it.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of ChargeMesh does this issue affect?
      options:
        - Mobile Application (apps/mobile)
        - Backend CSMS Gateway (apps/backend)
        - Operations Admin Portal (apps/admin)
        - Shared Domain Packages (packages/*)
        - Docker & Local Infrastructure
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do we trigger this behavior?
      placeholder: |
        1. Open ChargeMesh mobile app
        2. Navigate to 'Map' tab
        3. Search for district 'South Delhi'
        4. Observe station marker status
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Operating System, Node version, Device / Android version, etc.
      placeholder: |
        - OS: Android 14 (API 34) / Windows 11 / macOS 14
        - Node Version: 20.x
        - npm Version: 10.x
        - Device Model: Samsung Galaxy S23 / Pixel 7 Emulator
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste terminal output, error logs, or drag-and-drop screenshots here.
      render: shell
