name: Security & Secret Scan

on:
  push:
    branches: [prod, beta]
  pull_request:
    branches: [prod, beta]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify No Production Secrets in Repository
        run: |
          echo "Scanning working tree for accidental credentials..."
          ! grep -rnE "(AKIA[0-9A-Z]{16}|rzp_live_[a-zA-Z0-9]+|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=dist \
            --exclude-dir=.next \
            --exclude-dir=reports \
            --exclude-dir=docs \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            .
          echo "Zero production credentials detected."

      - name: Dependency Audit Check
        run: |
          echo "Running dependency vulnerability check..."
          npm audit --audit-level=critical --workspaces || true
