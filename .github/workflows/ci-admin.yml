name: CI — Admin Portal

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - '.github/workflows/ci-admin.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - '.github/workflows/ci-admin.yml'

jobs:
  test:
    name: Typecheck & Validate Admin Portal
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/shared-constants

      - name: Typecheck
        run: npm run typecheck --workspace=apps/admin
