name: CI — Admin Portal

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - 'packages/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/admin/**'
      - 'packages/**'

jobs:
  test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=apps/admin

      - name: Lint
        run: npm run lint --workspace=apps/admin

      - name: Test
        run: npm run test --workspace=apps/admin
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build --workspace=apps/admin
        env:
          NODE_ENV: production
          NEXT_PUBLIC_APP_NAME: ChargeMesh Admin
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.chargemesh.in/api/v1
