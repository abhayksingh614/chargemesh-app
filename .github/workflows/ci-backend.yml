name: CI — Backend Gateway

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/backend/**'
      - 'packages/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  test:
    name: Typecheck, Test & Build Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: chargemesh_test
          POSTGRES_USER: chargemesh
          POSTGRES_PASSWORD: chargemesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/shared-constants

      - name: Typecheck
        run: npm run typecheck --workspace=apps/backend

      - name: Run Unit Tests
        run: npm run test --workspace=apps/backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: chargemesh_test
          DB_USER: chargemesh
          DB_PASSWORD: chargemesh_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_jwt_secret_at_least_64_chars_long_for_testing_only
          JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_64_chars_long_for_testing_only

      - name: Build Backend
        run: npm run build --workspace=apps/backend
