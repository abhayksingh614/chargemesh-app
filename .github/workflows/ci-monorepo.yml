name: CI — Monorepo Typecheck & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    name: Monorepo Typecheck & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: chargemesh_test
          POSTGRES_USER: chargemesh
          POSTGRES_PASSWORD: chargemesh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/shared-constants

      - name: Monorepo Typecheck (All 5 Workspaces)
        run: npm run typecheck

      - name: Backend Unit Tests
        run: npm run test:backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: chargemesh_test
          DB_USER: chargemesh
          DB_PASSWORD: chargemesh_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_jwt_secret_at_least_64_chars_long_for_testing_only
          JWT_REFRESH_SECRET: ci_test_refresh_secret_at_least_64_chars_long_for_testing_only

      - name: Backend Build Check
        run: npm run build:backend
